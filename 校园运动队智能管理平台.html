          { text: '取消', onClick: ({ close }) => close() },
          { text: '应用', primary: true, onClick: ({ close, body }) => {
            const v = body.querySelector('#bs').value;
            recs.forEach(r => { if (!VBM.q.onTime(r.status)) r.status = v; });
            render(); close();
          } }
        ]
      });
    };
    c.querySelector('#save').onclick = () => {
      // 回写训练汇总（实际人数由出勤记录驱动）
      t.actual_count = recs.filter(r => VBM.q.onTime(r.status)).length;
      t.leave_count = recs.filter(r => r.status === 'leave').length;
      t.absent_count = recs.filter(r => r.status === 'absent').length;
      t.late_count = recs.filter(r => r.status === 'late').length;
      // 同步球员月度出勤率
      VBM.D.players.forEach(p => {
        const rs = VBM.q.recsOfPlayer(p.id);
        p.attendance_rate = Math.round(rs.filter(a => VBM.q.onTime(a.status)).length / rs.length * 100);
      });
      renderAnomaly();
      VBM.toast('签到记录已保存，出勤数据已更新', 'ok');
    };
    c.querySelector('[data-back]').onclick = () => VBM.go('attendance');

    function renderAnomaly() {
      const anomalies = VBM.q.attendanceAnomalies();
      const box2 = c.querySelector('#anomaly');
      if (!anomalies.length) { box2.innerHTML = '<div class="lineup-alert la-ok">' + icon('check') + '近 4 次训练无出勤异常。</div>'; return; }
      box2.innerHTML = anomalies.map(a => `<div class="lineup-alert la-info">${icon('info')}
        <div><strong>${a.player.name}</strong> 近 ${a.total} 次训练中有 ${a.bad} 次非出勤（请假/缺勤/迟到），建议关注。<br>
        <span style="font-size:11.5px;opacity:.8">说明：系统仅基于客观出勤记录提示，不做球员能力、健康或人格判断。</span></div></div>`).join('');
    }
    renderAnomaly();
  };
})();

/* ===== js/pages/lineup.js ===== */
/* 阵容配置 —— 排球场示意 + 点击替换 + 拖拽 + 校验 + 信息辅助 */
(function () {
  const VBM = window.VBM;
  const { icon, esc } = VBM;
  VBM.pages = VBM.pages || {};
  const NS = 'http://www.w3.org/2000/svg';

  VBM.pages.lineup = function (c, params) {
    const matchId = params.matchId || 'M6';
    const match = VBM.q.match(matchId);
    const D = VBM.D;
    let L = D.lineups[matchId];
    let variants = [{ name: L.name, data: clone(L.map), saved: L.saved }];
    let vi = 0;
    let selectedSlot = null;

    function clone(o) { return JSON.parse(JSON.stringify(o)); }

    c.innerHTML = `
      <span class="back-link" data-back>${icon('chevron-left')} 返回比赛管理</span>
      <div class="page-head">
        <div><div class="page-title">比赛阵容</div>
          <div class="page-desc">比赛名称：2026 高校排球比赛 · 南京大学 vs ${match.opponent} · ${match.date}</div></div>
        <div class="head-actions">
          <button class="btn btn-ghost" id="altLineup">${icon('plus')} 创建备用阵容</button>
          <button class="btn btn-primary" id="saveLineup">${icon('save')} 保存阵容</button>
        </div>
      </div>
      <div class="seg" id="varSeg" style="margin-bottom:16px"></div>
      <div id="alertBox" style="margin-bottom:14px"></div>
      <div class="lineup-wrap">
        <div class="court-box" id="courtBox"></div>
        <div class="bench-card card" id="benchCard">
          <div class="card-title">替补 / 可用球员</div>
          <div class="info-tip">${icon('info')} 拖拽球员到场上位置，或点击场上圆圈换人。系统仅提供客观出勤/技术数据，<strong>不自动判定首发</strong>，最终阵容由教练/队长决定。</div>
          <div id="benchList"></div>
        </div>
      </div>`;

    /* ---------- 球场 SVG ---------- */
    const courtBox = c.querySelector('#courtBox');
    function buildCourt() {
      const W = 480, H = 520;
      const svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
      svg.classList.add('court');
      // 场地
      svg.appendChild(rect(24, 24, W - 48, H - 48, 24, '#FFF', '#B98FCB', 2.5));
      // 中线
      svg.appendChild(line(W / 2, 24, W / 2, H - 24, '#B98FCB', 2));
      // 网（中线加粗虚线带）
      svg.appendChild(line(24, H / 2, W - 24, H / 2, '#722F86', 3.5, '7 5'));
      svg.appendChild(text('三米线', 40, 152, 10, '#B596C7'));
      svg.appendChild(line(24, 142, W - 24, 142, '#D6B9E6', 1.5));
      svg.appendChild(line(24, H - 142, W - 24, H - 142, '#D6B9E6', 1.5));
      svg.appendChild(text('球网', W - 48, H / 2 - 8, 11, '#722F86', 'end'));

      // 位置槽
      D.slotDef.forEach(s => {
        const cur = variants[vi].data[s.key];
        const p = cur ? VBM.q.player(cur.player_id) : null;
        const g = document.createElementNS(NS, 'g');
        g.setAttribute('class', 'slot-node' + (p ? '' : 'empty'));
        g.setAttribute('data-slot', s.key);
        g.setAttribute('transform', `translate(${s.x},${s.y})`);
        g.appendChild(circle(0, 0, 33, '', 'slot-circle'));
        const pt = document.createElementNS(NS, 'text');
        pt.setAttribute('y', -40); pt.setAttribute('text-anchor', 'middle');
        pt.setAttribute('class', 'slot-pos'); pt.textContent = s.pos;
        g.appendChild(pt);
        if (p) {
          const nt = document.createElementNS(NS, 'text');
          nt.setAttribute('y', 4); nt.setAttribute('text-anchor', 'middle');
          nt.setAttribute('class', 'slot-name'); nt.textContent = p.name.length > 3 ? p.name.slice(0, 3) : p.name;
          g.appendChild(nt);
          // 号码小徽
          g.appendChild(circle(24, -24, 10, VBM.D.POS_COLOR[p.position], ''));
          const ntt = document.createElementNS(NS, 'text');
          ntt.setAttribute('x', 24); ntt.setAttribute('y', -20); ntt.setAttribute('text-anchor', 'middle');
          ntt.setAttribute('class', 'slot-num'); ntt.textContent = p.number;
          g.appendChild(ntt);
        } else {
          const et = document.createElementNS(NS, 'text');
          et.setAttribute('y', 4); et.setAttribute('text-anchor', 'middle');
          et.setAttribute('class', 'slot-pos'); et.textContent = '待配置';
          g.appendChild(et);
        }
        g.addEventListener('click', () => openPicker(s.key));
        // 拖拽接收
        g.addEventListener('dragover', e => { e.preventDefault(); g.classList.add('drag-over'); });
        g.addEventListener('dragleave', () => g.classList.remove('drag-over'));
        g.addEventListener('drop', e => {
          e.preventDefault(); g.classList.remove('drag-over');
          assignPlayer(s.key, Number(e.dataTransfer.getData('pid')));
        });
        svg.appendChild(g);
      });
      courtBox.innerHTML = '';
      courtBox.appendChild(svg);
    }

    /* ---------- 替补列表 ---------- */
    function buildBench() {
      const onCourt = Object.values(variants[vi].data).filter(Boolean).map(x => x.player_id);
      const listBox = c.querySelector('#benchList');
      listBox.innerHTML = VBM.D.players.map(p => {
        const active = onCourt.includes(p.id);
        return `<div class="player-chip ${active ? '' : ''}" draggable="${active ? 'false' : 'true'}" data-pid="${p.id}" style="${active ? 'opacity:.4;cursor:not-allowed' : ''}">
          <span class="pc-num">${p.number}</span>
          <div class="pc-info"><strong>${p.name}</strong><small>${p.position} · 出勤${p.attendance_rate}% · 扣球${p.spike_success_rate}%</small></div>
        </div>`;
      }).join('');
      listBox.querySelectorAll('[data-pid]').forEach(chip => {
        chip.addEventListener('dragstart', e => {
          chip.classList.add('dragging');
          e.dataTransfer.setData('pid', chip.getAttribute('data-pid'));
        });
        chip.addEventListener('dragend', () => chip.classList.remove('dragging'));
      });
    }

    /* ---------- 点击换人弹层（含客观信息辅助） ---------- */
    function openPicker(slotKey) {
      const needPos = L.slotPos[slotKey];
      const onCourt = Object.values(variants[vi].data).filter(Boolean).map(x => x.player_id);
      const candidates = VBM.D.players.filter(p => !onCourt.includes(p.id));
      VBM.modal({
        title: `替换 · ${needPos}（${slotLabel(slotKey)}）`, size: 'lg',
        body: `<div class="info-tip" style="margin-bottom:12px">${icon('target')} 建议从 <strong>${needPos}</strong> 中选择；下方按位置分组，仅展示客观数据供参考。</div>
          <div class="table-wrap"><table class="data-table">
            <thead><tr><th>球员</th><th>位置</th><th class="num">近4周出勤率</th><th class="num">扣球成功率</th><th class="num">一传到位率</th><th></th></tr></thead>
            <tbody>${candidates.map(p => `<tr>
              <td><div class="cell-player">${VBM.avatar(p)}<strong>${p.name}</strong></div></td>
              <td><span class="tag tag-purple">${p.position}</span></td>
              <td class="num">${p.attendance_rate}%</td>
              <td class="num">${p.spike_success_rate}%</td>
              <td class="num">${p.pass_rate}%</td>
              <td><button class="btn btn-sm btn-primary" data-pick="${p.id}">选用</button></td>
            </tr>`).join('')}</tbody></table></div>`,
        onMount: body => body.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => {
          assignPlayer(slotKey, Number(b.getAttribute('data-pick')));
          document.querySelector('.modal-mask')?.remove();
        })
      });
    }
    function slotLabel(k) { return { oh1: '主攻一', oh2: '主攻二', mb1: '副攻一', mb2: '副攻二', set: '二传', opp: '接应', lib: '自由人' }[k]; }

    function assignPlayer(slotKey, pid) {
      // 若该球员已在其他槽位，先交换/清空
      for (const k in variants[vi].data) {
        const cell = variants[vi].data[k];
        if (cell && cell.player_id === pid && k !== slotKey) variants[vi].data[k] = variants[vi].data[slotKey] || null;
      }
      variants[vi].data[slotKey] = { player_id: pid, position: L.slotPos[slotKey], starting: 1 };
      variants[vi].saved = false;
      refresh();
      VBM.toast('已调整位置，记得保存阵容');
    }

    /* ---------- 校验 ---------- */
    function validate() {
      const data = variants[vi].data;
      const errs = [], infos = [];
      const placed = Object.values(data).filter(Boolean).map(x => x.player_id);
      // 空槽
      L.slots.forEach(k => { if (!data[k]) errs.push(`位置「${L.slotPos[k]} · ${slotLabel(k)}」尚未配置球员。`); });
      // 重复
      const dup = placed.filter((id, i) => placed.indexOf(id) !== i);
      if (dup.length) errs.push('同一球员不能同时出现在多个位置。');
      // 位置覆盖
      const covered = {};
      Object.entries(data).forEach(([k, v]) => { if (v) covered[VBM.q.player(v.player_id).position] = true; });
      ['主攻', '副攻', '二传', '接应', '自由人'].forEach(pos => {
        if (!covered[pos]) errs.push(`当前阵容缺少${pos}，请补充后再保存。`);
      });
      return { errs, infos };
    }
    function renderAlert(showAll) {
      const { errs } = validate();
      const box = c.querySelector('#alertBox');
      if (!errs.length) {
        box.innerHTML = `<div class="lineup-alert la-ok">${icon('check')} 阵容结构完整（主攻/副攻/二传/接应/自由人齐备，无重复），可保存。最终是否首发仍由教练/队长确认。</div>`;
      } else if (showAll) {
        box.innerHTML = errs.map(e => `<div class="lineup-alert la-error">${icon('alert')}<div>${e}</div></div>`).join('');
      } else {
        box.innerHTML = `<div class="lineup-alert la-info">${icon('info')}<div>阵容配置中，保存时将自动校验结构（共 ${errs.length} 项待处理）。</div></div>`;
      }
    }

    /* ---------- 变体（备用阵容） ---------- */
    function buildVarSeg() {
      const seg = c.querySelector('#varSeg');
      seg.innerHTML = variants.map((v, i) => `<button data-i="${i}" class="${i === vi ? 'active' : ''}">${v.name}${v.saved ? '' : ' ●'}</button>`).join('');
      seg.querySelectorAll('button').forEach(b => b.onclick = () => { vi = Number(b.getAttribute('data-i')); refresh(); });
    }
    c.querySelector('#altLineup').onclick = () => {
      const data = {};
      L.slots.forEach(k => data[k] = null);
      variants.push({ name: '备用阵容 ' + String.fromCharCode(66 + variants.length - 1), data, saved: false });
      vi = variants.length - 1;
      refresh();
      VBM.toast('已创建空白备用阵容');
    };

    c.querySelector('#saveLineup').onclick = () => {
      const { errs } = validate();
      renderAlert(true);
      if (errs.length) { VBM.toast('阵容存在错误，无法保存', 'err'); return; }
      // 写回数据层
      L.map = clone(variants[vi].data);
      const onCourt = Object.values(L.map).map(x => x.player_id);
      L.bench = VBM.D.players.filter(p => !onCourt.includes(p.id)).map(p => p.id);
      L.saved = true; L.name = variants[vi].name;
      variants[vi].saved = true;
      VBM.toast('阵容已保存并关联本场比赛', 'ok');
      refresh();
    };

    function refresh() { buildVarSeg(); buildCourt(); buildBench(); renderAlert(false); }
    refresh();
    c.querySelector('[data-back]').onclick = () => VBM.go('matches');
    if (VBM.state.role === 'player') VBM.playerize(c);
  };

  /* SVG 小工具 */
  function rect(x, y, w, h, r, fill, stroke, sw) {
    const e = document.createElementNS(NS, 'rect');
    Object.entries({ x, y, width: w, height: h, rx: r, fill, stroke, 'stroke-width': sw }).forEach(([k, v]) => e.setAttribute(k, v));
    return e;
  }
  function line(x1, y1, x2, y2, stroke, sw, dash) {
    const e = document.createElementNS(NS, 'line');
    Object.entries({ x1, y1, x2, y2, stroke, 'stroke-width': sw }).forEach(([k, v]) => e.setAttribute(k, v));
    if (dash) e.setAttribute('stroke-dasharray', dash);
    return e;
  }
  function circle(cx, cy, r, fill, cls) {
    const e = document.createElementNS(NS, 'circle');
    e.setAttribute('cx', cx); e.setAttribute('cy', cy); e.setAttribute('r', r);
    if (fill) e.setAttribute('fill', fill);
    if (cls) e.setAttribute('class', cls);
    return e;
  }
  function text(t, x, y, size, fill, anchor) {
    const e = document.createElementNS(NS, 'text');
    e.setAttribute('x', x); e.setAttribute('y', y); e.setAttribute('font-size', size);
    e.setAttribute('fill', fill); if (anchor) e.setAttribute('text-anchor', anchor);
    e.textContent = t; return e;
  }
})();

/* 比赛管理 + 比赛详情（阵容 / 数据记录 / 复盘） */
(function () {

      <span class="tag ${m.status === 'upcoming' ? 'tag-blue' : won ? 'tag-green' : 'tag-red'}">${m.status === 'upcoming' ? '待进行' : won ? '胜' : '负'}</span>

        <span>${icon('calendar')} ${m.date}</span>
        <span>${icon('pin')} ${m.location}</span>

  function addMatchForm() {

      </div>`,
      buttons: [
        { text: '取消', onClick: ({ close }) => close() },
        { text: '创建并去配置阵容', primary: true, onClick: ({ close, body }) => {
          const opp = body.querySelector('#mm_opp').value.trim();

          const slots = VBM.D.slotDef.map(s => s.key);

      <span class="back-link" data-back>${icon('chevron-left')} 返回比赛管理</span>

        <div style="flex:1">

        </div>
        ${finished ? `<div style="text-align:center"><div style="font-size:34px;font-weight:800">${m.score}</div></div>` : ''}

      <div class="grid g-2">

            <button class="btn btn-sm btn-soft" data-go="lineup?matchId=${m.id}">${icon('grid')} 配置阵容</button></div>

              return `<span class="player-chip" style="cursor:default;padding:7px 11px"><span class="pc-num">${p.number}</span>
                <div class="pc-info"><strong style="font-size:12.5px">${p.name}</strong><small>${x.position}</small></div></span>`;
            }).join('') || '<span style="color:var(--ink-3);font-size:13px">尚未配置首发</span>'}
          </div>
          <div class="card-title" style="font-size:13px;margin-bottom:8px">替补（${L.bench.length}）</div>
          <div style="display:flex;flex-wrap:wrap;gap:7px">
            ${L.bench.map(id => { const p = VBM.q.player(id); return `<span class="tag tag-gray">#${p.number} ${p.name}</span>`; }).join('')}
          </div>
        </div>

        <div class="card">
          <div class="card-head"><div class="card-title">${finished ? '比赛数据' : '比赛数据记录'}</div>
            ${finished ? '' : '<button class="btn btn-sm btn-ghost" id="editStats">录入数据</button>'}</div>

      ${finished ? `<div class="card section-gap">
        <div class="card-title" style="margin-bottom:10px">${icon('refresh')} 比赛复盘（客观数据摘要）</div>
        <div id="review"></div>
      </div>` : ''}`;

    /* 数据网格 */
    const statsBody = c.querySelector('#statsBody');
    function statFields() {
      return [
        ['一传到位', 'pass_success'], ['发球得分', 'serve_score'], ['发球失误', 'serve_error'],
        ['扣球得分', 'spike_score'], ['扣球失误', 'spike_error'], ['拦网得分', 'block_score'],
        ['防守成功', 'defense_success'], ['得分', 'score'], ['失分', 'against']
      ];
    }
    function renderStats(readonly) {
      const s = m.stats || {};
      statsBody.innerHTML = `<div class="grid g-3">
        ${statFields().map(f => `<div style="border:1px solid var(--line);border-radius:10px;padding:11px 13px">
          <div style="font-size:12px;color:var(--ink-3)">${f[0]}</div>
          ${readonly ? `<div style="font-size:21px;font-weight:800;margin-top:2px">${s[f[1]] ?? '—'}</div>`
            : `<input class="input" style="margin-top:4px;padding:7px 9px" type="number" data-k="${f[1]}" value="${s[f[1]] ?? ''}">`}
        </div>`).join('')}
      </div>`;
    }
    renderStats(finished);

    if (!finished) {
      c.querySelector('#editStats').onclick = () => {
        renderStats(false);
        const btn = document.createElement('button');
        btn.className = 'btn btn-primary btn-block';
        btn.style.marginTop = '13px';
        btn.innerHTML = icon('save') + ' 保存并结束比赛';
        statsBody.appendChild(btn);
        btn.onclick = () => {
          const st = {};
          statsBody.querySelectorAll('[data-k]').forEach(i => st[i.getAttribute('data-k')] = Number(i.value) || 0);
          m.stats = st;
          // 依据得失分客观生成胜负（不做能力评价）
          m.status = 'finished';
          m.result = st.score >= st.against ? 'W' : 'L';
          m.score = '3:2';
          L.saved = true;
          VBM.toast('比赛数据已保存，已进入复盘，数据汇入球队分析', 'ok');
          VBM.go('match/' + m.id);
        };
      };
    }

    /* 复盘摘要（基于客观统计，不评价个人） */
    if (finished) {
      const s = m.stats;
      const passRate = Math.round(s.pass_success / (s.pass_success + 20) * 100);
      const spikeEff = Math.round(s.spike_score / (s.spike_score + s.spike_error) * 100);
      c.querySelector('#review').innerHTML = `<div class="grid g-4">
        ${[
          ['一传到位次数', s.pass_success], ['扣球效率', spikeEff + '%'],
          ['发球净得分', s.serve_score - s.serve_error], ['拦网得分', s.block_score],
          ['防守成功', s.defense_success], ['总得分', s.score],
          ['总失分', s.against], ['净胜分', s.score - s.against]
        ].map(x => `<div style="border:1px solid var(--line);border-radius:10px;padding:12px 14px">
          <div style="font-size:12px;color:var(--ink-3)">${x[0]}</div>
          <div style="font-size:20px;font-weight:800;margin-top:2px">${x[1]}</div></div>`).join('')}
      </div>
      <div class="info-tip" style="margin-top:14px">${icon('info')} 复盘仅汇总客观技术统计与得失分，供教练/队长参考后续训练安排，系统不对球员个人能力做自动评价。</div>`;
    }

    c.querySelector('[data-back]').onclick = () => VBM.go('matches');
    const go = c.querySelector('[data-go]');
    if (go) go.onclick = () => VBM.go(go.getAttribute('data-go'));
  };
})();

(function () {

          </div>

      </div>

        ${[
          ['本月出勤率', S.attendance, 'trend', '#722F86'],
          ['训练完成率', S.completion, 'target', '#3E79C9'],
          ['一传到位率', S.pass, 'volleyball', '#2E9E6B'],
          ['扣球成功率', S.spike, 'trend', '#D9922B'],

      <div class="grid g-2">
        <div class="card">
          <div class="card-head"><div class="card-title">出勤率趋势</div></div>
          <div id="attChart"></div>
        </div>

          <div id="techChart"></div>

          <div class="card-title">球员数据对比</div>

            ${[
              ['attendance', '出勤率'], ['pass', '一传到位率'], ['spike', '扣球成功率'], ['serve', '发球得分率']
            ].map((m, i) => `<button data-v="${m[0]}" class="${i === 0 ? 'active' : ''}">${m[1]}</button>`).join('')}

        <div id="anomList"></div>
      </div>`;

    /* 出勤率折线（时间范围影响） */
    const labels = timeRange === 'week' ? ['周一', '周二', '周三', '周五'] : ['周1', '周2', '周3', '周4'];
    function attData() {
      if (timeRange === 'term') return [90, 89, 92, 91];
      return D.teamTrend.attendance;
    }
    c.querySelector('#attChart').appendChild(
      VBM.charts.lineChart(attData(), labels, { color: '#722F86', unit: '%', min: 80, max: 100 })
    );

    c.querySelector('#techChart').appendChild(VBM.charts.multiLine([
      { name: '一传到位率', data: D.teamTrend.pass, color: '#722F86' },
      { name: '扣球成功率', data: D.teamTrend.spike, color: '#D9922B' },
      { name: '发球得分率', data: D.teamTrend.serve, color: '#3E79C9' },
      { name: '拦网成功率', data: D.teamTrend.block, color: '#2E9E6B' }
    ], ['周1', '周2', '周3', '周4'], { min: 10, max: 70 }));

    /* 球员对比柱状图 */
    const metricMap = {
      attendance: p => p.attendance_rate,
      pass: p => p.pass_rate,
      spike: p => p.spike_success_rate,
      serve: p => p.serve_score_rate
    };
    const compareBox = c.querySelector('#compareChart');
    function renderCompare() {
      let list = D.players;
      if (posFilter !== '全部') list = list.filter(p => p.position === posFilter);
      list = [...list].sort((a, b) => metricMap[metric](b) - metricMap[metric](a));
      compareBox.innerHTML = '';
      compareBox.appendChild(VBM.charts.barChart(
        list.map(metricMap[metric]), list.map(p => p.name),
        { color: VBM.charts.PAL[0], max: 100 }
      ));
    }
    renderCompare();

    /* 异常 */
    const anomalies = VBM.q.attendanceAnomalies();
    c.querySelector('#anomList').innerHTML = anomalies.length ? anomalies.map(a =>
      `<div class="lineup-alert la-info" style="margin-bottom:8px">${icon('info')}<div><strong>${a.player.name}</strong>（${a.player.position}）近 ${a.total} 次训练 ${a.bad} 次非出勤。系统仅提示客观出勤，不做能力/健康判断。</div></div>`
    ).join('') : '<div class="lineup-alert la-ok">' + icon('check') + '暂无出勤异常。</div>';
    // 数据波动提醒
    c.querySelector('#anomList').insertAdjacentHTML('beforeend',
      `<div class="lineup-alert la-info">${icon('trend')}<div>本周一传到位率较上周下降 5%（63%→58%），建议增加接发球训练（建议项，最终由教练/队长决定）。</div></div>`);

    /* 交互 */
    c.querySelector('#timeSeg').querySelectorAll('button').forEach(b => b.onclick = () => {
      timeRange = b.getAttribute('data-v');
      c.querySelector('#timeSeg').querySelectorAll('button').forEach(x => x.classList.toggle('active', x === b));
      const att = c.querySelector('#attChart'); att.innerHTML = '';
      att.appendChild(VBM.charts.lineChart(attData(), labels, { color: '#722F86', unit: '%', min: 80, max: 100 }));
    });
    c.querySelector('#posSel').onchange = e => { posFilter = e.target.value; renderCompare(); };
    c.querySelector('#metricSeg').querySelectorAll('button').forEach(b => b.onclick = () => {
      metric = b.getAttribute('data-v');
      c.querySelector('#metricSeg').querySelectorAll('button').forEach(x => x.classList.toggle('active', x === b));
      renderCompare();
    });
    if (VBM.state.role === 'player') VBM.playerize(c);
  };
})();

  }

  const routes = [
    { re: /^home$/, page: 'home' },
    { re: /^players$/, page: 'players' },
    { re: /^player\/(\d+)$/, page: 'playerDetail' },
    { re: /^training\/new$/, page: 'createTraining' },
    { re: /^training\/detail$/, page: 'trainingDetail' },
    { re: /^training$/, page: 'training' },
    { re: /^attendance\/checkin$/, page: 'checkin' },
    { re: /^attendance$/, page: 'attendance' },
    { re: /^lineup$/, page: 'lineup' },
    { re: /^matches$/, page: 'matches' },
    { re: /^match\/([\w\d]+)$/, page: 'matchDetail' },
    { re: /^analytics$/, page: 'analytics' },
    { re: /^notifications$/, page: 'notifications' },
    { re: /^settings$/, page: 'settings' }
  ];

  function parseQuery(str) {
    const o = {};
    str.split('&').filter(Boolean).forEach(kv => { const [k, v] = kv.split('='); o[k] = decodeURIComponent(v || ''); });
    return o;
  }

  let currentPath = 'home';

  function renderRoute(rawPath) {
    const raw = (rawPath || currentPath || 'home').replace(/^#/, '');
    currentPath = raw;
    const [path, qstr] = raw.split('?');
    const params = parseQuery(qstr || '');
    let match = routes.find(r => r.re.test(path));
    if (!match) { match = routes[0]; }
    // 将路径中的捕获组映射为参数
    const cap = path.match(match.re);
    if (cap && cap.length > 1) {
      if (match.page === 'playerDetail') params.id = cap[1];
      if (match.page === 'matchDetail') params.id = cap[1];
    }
    // 球员角色不允许进入设置
    if (match.page === 'settings' && VBM.state.role === 'player') { VBM.go('home'); return; }

    try { window.scrollTo(0, 0); } catch (e) {}
    main.innerHTML = '';
    const fn = VBM.pages[match.page];
    if (fn) fn(main, params); else main.innerHTML = '<div class="empty">页面建设中</div>';
    setActiveNav(path);
    document.getElementById('sidebar').classList.remove('open');
  }

  // 统一导航入口：不依赖浏览器对 hash 链接 / hashchange 的支持
  function navigate(path) {
    const raw = String(path || 'home').replace(/^#/, '');
    if (raw === currentPath) {
      // 即便路径相同也确保地址栏同步
      try { if (location.hash.slice(1) !== raw) location.hash = raw; } catch (e) {}
      return;
    }
    try { location.hash = raw; } catch (e) {} // 某些预览环境可能限制，忽略后仍直接渲染
    renderRoute(raw);
  }

  function setActiveNav(path) {
    document.querySelectorAll('.nav-item').forEach(a => {
      const r = a.getAttribute('data-route').split('?')[0];
      const cur = path.split('/')[0];
      a.classList.toggle('active', r === cur || (r === 'home' && cur === ''));
    });
  }

  VBM.go = navigate;

  /* 拦截所有 hash 链接点击（导航栏 / 通知面板 / 页内链接），直接渲染，
     避免某些内嵌预览 WebView 不处理锚点跳转或 hashchange。 */
  document.addEventListener('click', function (e) {
    const a = e.target.closest('a[href^="#"]');
    if (!a) return;
    const dest = a.getAttribute('href').slice(1);
    if (!dest) return;
    e.preventDefault();
    navigate(dest);
  });

  /* ---------------- 顶栏日期 ---------------- */
  function fillDate() {
    const d = new Date(VBM.D.today + 'T00:00:00');
    document.getElementById('tbDate').textContent =
      `${d.getFullYear()} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日 ${['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'][d.getDay()]}`;
  }

  /* ---------------- 通知下拉 ---------------- */
  const TYPE_ICO = {
    '训练': { ico: 'calendar', bg: 'var(--purple-soft)', fg: 'var(--purple)' },
    '出勤': { ico: 'clipboard', bg: 'var(--blue-bg)', fg: 'var(--blue)' },
    '比赛': { ico: 'trophy', bg: 'var(--green-bg)', fg: 'var(--green)' },
    '数据': { ico: 'chart', bg: 'var(--amber-bg)', fg: 'var(--amber)' }
  };
  function buildNotifyPanel() {
    const unread = VBM.D.notices.filter(n => n.unread).length;
    document.getElementById('notifyDot').style.display = unread ? 'block' : 'none';
    const panel = document.getElementById('notifyPanel');
    panel.innerHTML = `<div class="np-head"><strong>通知</strong><span class="tag tag-purple">${unread} 条未读</span></div>
      ${VBM.D.notices.slice(0, 5).map(n => {
        const m = TYPE_ICO[n.type];
        return `<div class="np-item">
          <span class="np-ico" style="background:${m.bg};color:${m.fg}">${icon(m.ico)}</span>
          <div style="flex:1"><p>${n.body}</p><time>${n.when}</time></div>
        </div>`;
      }).join('')}
      <a class="np-all" href="#notifications">查看全部通知</a>`;
  }
  document.getElementById('notifyBtn').addEventListener('click', e => {
    e.stopPropagation();
    document.getElementById('notifyPanel').classList.toggle('open');
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('.notify-wrap')) document.getElementById('notifyPanel').classList.remove('open');
  });

  /* ---------------- 角色切换（权限演示） ---------------- */
  document.querySelectorAll('.rs-btn').forEach(b => b.addEventListener('click', () => {
    const role = b.getAttribute('data-role');
    VBM.state.role = role;
    document.querySelectorAll('.rs-btn').forEach(x => x.classList.toggle('active', x === b));
    document.getElementById('tbRole').textContent = role === 'coach' ? '队长' : '球员';
    buildNav();
    renderRoute();
    VBM.toast(role === 'coach' ? '已切换到教练/队长视角（完整管理权限）' : '已切换到球员视角（只读）', 'info');
  }));

  /* 球员只读化处理 */
  VBM.playerize = function (c) {
    const hideSel = ['.head-actions', '#addPlayer', '#newTr', '#allPresent', '#batch', '#save', '#saveLineup', '#altLineup', '#editStats', '#addMatch', '#edit'];
    hideSel.forEach(s => c.querySelectorAll(s).forEach(n => n.style.display = 'none'));
    const note = document.createElement('div');
    note.className = 'readonly-note';
    note.innerHTML = icon('shield') + '球员视角：仅可查看训练计划、个人记录/数据、比赛安排、出勤与阵容，不能修改或决定首发。';
    c.insertBefore(note, c.firstChild);
  };

  /* 移动端菜单 */
  document.getElementById('menuToggle').addEventListener('click', () => document.getElementById('sidebar').classList.toggle('open'));

  /* ---------------- 初始化 ---------------- */
  buildNav();
  fillDate();
  buildNotifyPanel();
  // 浏览器前进/后退（若环境支持 hashchange）
  window.addEventListener('hashchange', function () {
    const raw = (location.hash || '#home').slice(1);
    if (raw !== currentPath) renderRoute(raw);
  });
  // 初始路由：优先用地址栏已有 hash，否则首页
  const initial = (location.hash || '#home').slice(1) || 'home';
  renderRoute(initial);
})();

</script>
</body>
</html>
