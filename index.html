<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>校园运动队智能管理平台 · 南京大学女子排球队</title>
<meta name="description" content="训练管理—球员管理—阵容管理—数据分析—比赛复盘 一体化平台" />
<link rel="stylesheet" href="./css/style.css" />
</head>
<body>
<div id="app">
  <!-- 左侧导航 -->
  <aside id="sidebar" class="sidebar">
    <div class="brand">
      <span class="brand-logo" data-icon="volleyball"></span>
      <span class="brand-text">
        <strong>校队智管</strong>
        <small>Campus Team Hub</small>
      </span>
    </div>
    <nav id="nav" class="nav"></nav>
    <div class="sidebar-foot">
      <div class="role-switch">
        <span class="rs-label">当前视角</span>
        <div class="rs-seg">
          <button class="rs-btn active" data-role="coach">教练/队长</button>
          <button class="rs-btn" data-role="player">球员</button>
        </div>
      </div>
    </div>
  </aside>

  <!-- 顶部信息栏 -->
  <header id="topbar" class="topbar">
    <button id="menuToggle" class="icon-btn menu-toggle" aria-label="菜单"><span data-icon="menu"></span></button>
    <div class="tb-team">
      <span class="tb-team-name">南京大学女子排球队</span>
      <span class="tb-team-tag">2026 赛季</span>
    </div>
    <div class="tb-right">
      <span id="tbDate" class="tb-date"></span>
      <span id="tbRole" class="tb-role">队长</span>
      <div class="notify-wrap">
        <button id="notifyBtn" class="icon-btn" aria-label="通知">
          <span data-icon="bell"></span>
          <span id="notifyDot" class="notify-dot"></span>
        </button>
        <div id="notifyPanel" class="notify-panel"></div>
      </div>
      <div class="tb-user">
        <div class="tb-avatar">林</div>
        <div class="tb-user-meta">
          <strong>林知夏</strong>
          <small>队长 · 二传</small>
        </div>
      </div>
    </div>
  </header>

  <!-- 主内容 -->
  <main id="main" class="main"></main>
</div>

<!-- 弹窗容器 -->
<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root"></div>

<!-- 数据与工具 -->
<script src="./js/data.js"></script>
<script src="./js/charts.js"></script>
<script src="./js/components.js"></script>
<!-- 页面 -->
<script src="./js/pages/dashboard.js"></script>
<script src="./js/pages/players.js"></script>
<script src="./js/pages/training.js"></script>
<script src="./js/pages/attendance.js"></script>
<script src="./js/pages/lineup.js"></script>
<script src="./js/pages/matches.js"></script>
<script src="./js/pages/analytics.js"></script>
<script src="./js/pages/notifications.js"></script>
<script src="./js/pages/settings.js"></script>
<!-- 路由与交互 -->
<script src="./js/app.js"></script>
</body>
</html>
